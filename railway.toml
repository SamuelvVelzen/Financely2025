# Legacy Railway deploy — production now uses Cloudflare (see docs/deploy-cloudflare.md).

[build]
builder = "RAILPACK"
buildCommand = "corepack enable && yarn install --immutable && yarn build"

[deploy]
# SQLite lives on a volume mounted at /data. Volumes are not available during
# Railway pre-deploy, so migrate runs here at start instead.
startCommand = "npx prisma migrate deploy && yarn start"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
