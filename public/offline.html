<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#001f54" />
    <title>Offline | Financely</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f5;
        --surface: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --primary: #001f54;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --surface: #171717;
          --text: #f5f5f5;
          --muted: #a3a3a3;
          --primary: #3b82f6;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main {
        width: min(28rem, 100%);
        background: var(--surface);
        border-radius: 1rem;
        padding: 1.75rem;
        text-align: center;
        box-shadow: 0 1px 2px rgb(0 0 0 / 6%);
      }
      .mark {
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1rem;
        border-radius: 0.75rem;
        background: linear-gradient(135deg, #001f54, #003366);
        display: grid;
        place-items: center;
      }
      .mark svg {
        width: 1.5rem;
        height: 1.5rem;
        fill: white;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 1rem;
        background: var(--primary);
        color: white;
        font: inherit;
        font-weight: 600;
        padding: 0.7rem 1.1rem;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 2C10.3 2 9 3.3 9 5c0 1.2.7 2.3 1.7 2.8C8.4 8.7 7 10.7 7 13c0 2.8 2.2 5 5 5s5-2.2 5-5c0-2.3-1.4-4.3-3.7-5.2 1-.5 1.7-1.6 1.7-2.8 0-1.7-1.3-3-3-3z"
          />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        Financely can't reach the server for this page. Open a page you already
        visited, or reconnect and try again. Changes you saved offline will sync
        when you're back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
